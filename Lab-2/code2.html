<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            text-align: center;
        }

        .container {
            background-color: lightblue;
            width: 300px;
            margin: 100px auto;
            padding: 30px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        .login {
            background-color: green;
            color: white;
        }

        .cancel {
            background-color: red;
            color: white;
        }
        .container{
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Enter Username"><br>

            <input type="password" placeholder="Enter Password"><br><br>

            <input class="login" type="submit" value="Login">
            <input class="cancel" type="reset" value="Cancel">
        </form>
    </div>

</body>
</html>
