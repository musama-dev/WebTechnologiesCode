<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
</head>
<body>
    <h2>Student Details</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Ali</td>
            <td>20</td>
            <td>Karachi</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>22</td>
            <td>Lahore</td>
        </tr>
    </table>
</body>
</html>
